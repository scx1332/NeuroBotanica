<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- NeuroBotanica · Petal Cluster
       ink:    #2A2724
       accent: #2F5831  (= oklch(0.42 0.08 145)) -->

  <!-- top petal -->
  <ellipse cx="48" cy="28" rx="11" ry="20"
           fill="none" stroke="#2A2724" stroke-width="5"/>
  <!-- bottom-left petal -->
  <ellipse cx="30" cy="60" rx="11" ry="20"
           fill="none" stroke="#2A2724" stroke-width="5"
           transform="rotate(-60 30 60)"/>
  <!-- bottom-right petal -->
  <ellipse cx="66" cy="60" rx="11" ry="20"
           fill="none" stroke="#2A2724" stroke-width="5"
           transform="rotate(60 66 60)"/>

  <!-- center accent -->
  <circle cx="48" cy="50" r="6" fill="#2F5831"/>
</svg>
