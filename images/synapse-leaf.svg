<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- NeuroBotanica · Synapse Leaf
       Edit colors in the <style> block below.
       ink:    #2A2724
       accent: oklch(0.42 0.08 145)  ≈ #3F6B47 -->
  <style>
    .ink         { stroke: #2A2724; }
    .accent      { fill:   oklch(0.42 0.08 145); }
    .accent-line { stroke: oklch(0.42 0.08 145); }
  </style>

  <!-- leaf outline -->
  <path class="ink"
        d="M48 10 C 22 22, 16 50, 22 76 C 48 80, 74 64, 78 36 C 78 22, 66 12, 48 10 Z"
        stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- synaptic vein dots -->
  <circle class="accent" cx="34" cy="68" r="2.6"/>
  <circle class="accent" cx="42" cy="56" r="3"/>
  <circle class="accent" cx="50" cy="44" r="3.4"/>
  <circle class="accent" cx="58" cy="32" r="3"/>
  <circle class="accent" cx="66" cy="20" r="2.6"/>

  <!-- connecting line -->
  <path class="accent-line" d="M34 68 L 66 20"
        stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>
