<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- NeuroBotanica · Node Tree
       ink:    #2A2724
       accent: #2F5831  (= oklch(0.42 0.08 145)) -->

  <!-- trunk + branches -->
  <line x1="48" y1="86" x2="48" y2="54"
        stroke="#2A2724" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="54" x2="28" y2="34"
        stroke="#2A2724" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="54" x2="68" y2="34"
        stroke="#2A2724" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="54" x2="48" y2="26"
        stroke="#2A2724" stroke-width="4" stroke-linecap="round"/>

  <!-- nodes -->
  <circle cx="48" cy="86" r="4"   fill="#2A2724"/>
  <circle cx="48" cy="54" r="4.5" fill="#2A2724"/>
  <circle cx="28" cy="34" r="3.5" fill="#2A2724"/>
  <circle cx="68" cy="34" r="3.5" fill="#2A2724"/>

  <!-- top accent node — the bloom -->
