<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- NeuroBotanica · Node Tree
       ink:    #2A2724
       accent: oklch(0.42 0.08 145)  ≈ #3F6B47 -->
  <style>
    .ink-line { stroke: #2A2724; }
    .ink-fill { fill:   #2A2724; }
    .accent   { fill:   oklch(0.42 0.08 145); }
  </style>

  <!-- trunk + branches -->
  <line class="ink-line" x1="48" y1="86" x2="48" y2="54"
        stroke-width="4" stroke-linecap="round"/>
  <line class="ink-line" x1="48" y1="54" x2="28" y2="34"
        stroke-width="4" stroke-linecap="round"/>
  <line class="ink-line" x1="48" y1="54" x2="68" y2="34"
        stroke-width="4" stroke-linecap="round"/>
  <line class="ink-line" x1="48" y1="54" x2="48" y2="26"
        stroke-width="4" stroke-linecap="round"/>

  <!-- nodes -->
  <circle class="ink-fill" cx="48" cy="86" r="4"/>
  <circle class="ink-fill" cx="48" cy="54" r="4.5"/>
  <circle class="ink-fill" cx="28" cy="34" r="3.5"/>
  <circle class="ink-fill" cx="68" cy="34" r="3.5"/>

  <!-- top accent node — the bloom -->
  <circle class="accent" cx="48" cy="26" r="4"/>
</svg>
