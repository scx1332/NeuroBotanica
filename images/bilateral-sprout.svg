        stroke="#2A2724" stroke-width="5" stroke-linecap="round"/>

  <!-- leaves -->
  <path d="M30 38 C 22 32, 22 22, 30 18 C 38 22, 38 32, 30 38 Z" fill="#2F5831"/>
  <path d="M66 38 C 58 32, 58 22, 66 18 C 74 22, 74 32, 66 38 Z" fill="#2F5831"/>
