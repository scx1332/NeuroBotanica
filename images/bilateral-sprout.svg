<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- NeuroBotanica · Bilateral Sprout
       ink:    #2A2724
       accent: #2F5831  (= oklch(0.42 0.08 145)) -->

  <!-- ground -->
  <line x1="20" y1="80" x2="76" y2="80"
        stroke="#2A2724" stroke-width="5" stroke-linecap="round"/>

  <!-- stems -->
  <path d="M30 80 L 30 38" fill="none"
        stroke="#2A2724" stroke-width="5" stroke-linecap="round"/>
  <path d="M66 80 L 66 38" fill="none"
        stroke="#2A2724" stroke-width="5" stroke-linecap="round"/>

  <!-- diagonal — the implicit N -->
